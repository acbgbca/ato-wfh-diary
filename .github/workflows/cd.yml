name: CD

on:
  push:
    branches: [main]

jobs:
  build-and-push:
    name: Build and push to GHCR
    runs-on: ubuntu-latest

    permissions:
      contents: write   # needed to create/force-update the date tag
      packages: write   # needed to push to GHCR

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Compute today's date tag (UTC) and the lowercase image path required by GHCR.
      - name: Compute date tag
        id: vars
        run: |
          echo "date_tag=$(date -u +%Y.%m.%d)" >> $GITHUB_OUTPUT
          echo "image=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      # Create the tag locally and force-push it.  If a tag for today already
      # exists (e.g. a second merge on the same day) it is simply moved forward
      # to the new commit.
      - name: Tag commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -f ${{ steps.vars.outputs.date_tag }}
          git push origin -f ${{ steps.vars.outputs.date_tag }}

      # QEMU lets Buildx produce linux/arm64 images on the amd64 runner.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Log in to GHCR
        uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ steps.vars.outputs.image }}:${{ steps.vars.outputs.date_tag }}
            ${{ steps.vars.outputs.image }}:latest
          build-args: VERSION=${{ steps.vars.outputs.date_tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
