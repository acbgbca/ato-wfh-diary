name: CI

on:
  pull_request:
    branches: [main]

jobs:
  test:
    name: Format, vet, and test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Check formatting, vet, and run tests
        run: make check

  e2e:
    name: E2E tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      # browser-actions/setup-chrome installs Chrome without snap and puts it on
      # PATH; go-rod's launcher.LookPath() finds it. Avoids the flaky
      # apt/snap-based chromium-browser install (intermittent snapcraft 408s).
      - name: Install Chrome
        uses: browser-actions/setup-chrome@48ad923757ca74d66703209fe939badbdf80f2f4 # v2.2.0

      - name: Run E2E tests
        run: make test-e2e

  e2e-docker:
    name: E2E tests (Docker container)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      # browser-actions/setup-chrome installs Chrome without snap and puts it on
      # PATH; go-rod's launcher.LookPath() finds it. Avoids the flaky
      # apt/snap-based chromium-browser install (intermittent snapcraft 408s).
      - name: Install Chrome
        uses: browser-actions/setup-chrome@48ad923757ca74d66703209fe939badbdf80f2f4 # v2.2.0

      - name: Run E2E tests against Docker container
        run: make test-e2e-docker
